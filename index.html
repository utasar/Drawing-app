<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Creative Drawing Platform</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
        <link rel="stylesheet" href="style.css" />
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="app-container">
            <!-- Header -->
            <header class="header">
                <h1>🎨 Creative Drawing Platform</h1>
                <div class="header-actions">
                    <button id="tutorialsBtn" class="btn-icon" title="Tutorials">
                        <span class="material-icons">school</span>
                    </button>
                    <button id="achievementsBtn" class="btn-icon" title="Achievements">
                        <span class="material-icons">emoji_events</span>
                    </button>
                    <button id="inspirationBtn" class="btn-icon" title="Get Inspiration">
                        <span class="material-icons">lightbulb</span>
                    </button>
                </div>
            </header>

            <!-- Main Content -->
            <div class="main-content">
                <!-- Sidebar - Tools -->
                <aside class="sidebar">
                    <div class="tool-section">
                        <h3>Drawing Tools</h3>
                        <div class="tool-buttons">
                            <button class="tool-btn active" data-tool="brush" title="Brush">
                                <span class="material-icons">brush</span>
                            </button>
                            <button class="tool-btn" data-tool="pencil" title="Pencil">
                                <span class="material-icons">edit</span>
                            </button>
                            <button class="tool-btn" data-tool="marker" title="Marker">
                                <span class="material-icons">create</span>
                            </button>
                            <button class="tool-btn" data-tool="spray" title="Spray">
                                <span class="material-icons">scatter_plot</span>
                            </button>
                            <button class="tool-btn" data-tool="eraser" title="Eraser">
                                <span class="material-icons">auto_fix_high</span>
                            </button>
                        </div>
                    </div>

                    <div class="tool-section">
                        <h3>Brush Size</h3>
                        <div class="size-controls">
                            <button id="decrease" class="btn-small">-</button>
                            <span id="size">10</span>
                            <button id="increase" class="btn-small">+</button>
                        </div>
                        <input type="range" id="sizeSlider" min="1" max="50" value="10" />
                    </div>

                    <div class="tool-section">
                        <h3>Color Palette</h3>
                        <input type="color" id="color" value="#000000" />
                        <div class="color-presets">
                            <button class="color-preset" style="background: #000000;" data-color="#000000"></button>
                            <button class="color-preset" style="background: #FF0000;" data-color="#FF0000"></button>
                            <button class="color-preset" style="background: #00FF00;" data-color="#00FF00"></button>
                            <button class="color-preset" style="background: #0000FF;" data-color="#0000FF"></button>
                            <button class="color-preset" style="background: #FFFF00;" data-color="#FFFF00"></button>
                            <button class="color-preset" style="background: #FF00FF;" data-color="#FF00FF"></button>
                            <button class="color-preset" style="background: #00FFFF;" data-color="#00FFFF"></button>
                            <button class="color-preset" style="background: #FFFFFF; border: 1px solid #ccc;" data-color="#FFFFFF"></button>
                        </div>
                    </div>

                    <div class="tool-section">
                        <h3>Actions</h3>
                        <button id="undo" class="action-btn">
                            <span class="material-icons">undo</span> Undo
                        </button>
                        <button id="redo" class="action-btn">
                            <span class="material-icons">redo</span> Redo
                        </button>
                        <button id="clear" class="action-btn">
                            <span class="material-icons">delete</span> Clear
                        </button>
                    </div>

                    <div class="tool-section">
                        <h3>File</h3>
                        <button id="importBtn" class="action-btn">
                            <span class="material-icons">file_upload</span> Import
                        </button>
                        <input type="file" id="importFile" accept="image/*" style="display: none;" />
                        <button id="exportPNG" class="action-btn">
                            <span class="material-icons">file_download</span> Export PNG
                        </button>
                        <button id="exportJPG" class="action-btn">
                            <span class="material-icons">file_download</span> Export JPG
                        </button>
                        <button id="saveLocal" class="action-btn">
                            <span class="material-icons">save</span> Save to Gallery
                        </button>
                    </div>

                    <div class="tool-section">
                        <h3>Layers</h3>
                        <div id="layersList" class="layers-list">
                            <div class="layer-item active" data-layer="0">
                                <span>Layer 1</span>
                                <div class="layer-controls">
                                    <button class="layer-visible" title="Toggle visibility">
                                        <span class="material-icons">visibility</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                        <button id="addLayer" class="action-btn">
                            <span class="material-icons">add</span> Add Layer
                        </button>
                    </div>
                </aside>

                <!-- Canvas Area -->
                <div class="canvas-area">
                    <canvas id="canvas"></canvas>
                    <div id="canvasOverlay" class="canvas-overlay"></div>
                </div>

                <!-- Right Sidebar - Inspiration & Tutorials -->
                <aside class="right-sidebar">
                    <div class="panel" id="inspirationPanel">
                        <h3>✨ AI-Powered Inspiration</h3>
                        <p class="panel-subtitle">Trending topics to draw today</p>
                        <div id="inspirationContent" class="inspiration-content">
                            <p>Click "Get Inspiration" to discover trending themes!</p>
                        </div>
                    </div>

                    <div class="panel" id="tutorialPanel" style="display: none;">
                        <h3>📚 Tutorials</h3>
                        <div id="tutorialContent"></div>
                    </div>

                    <div class="panel" id="galleryPanel" style="display: none;">
                        <h3>🖼️ My Gallery</h3>
                        <div id="galleryContent" class="gallery-grid"></div>
                    </div>
                </aside>
            </div>
        </div>

        <!-- Modals -->
        <div id="achievementsModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>🏆 Your Achievements</h2>
                <div id="achievementsContent" class="achievements-grid"></div>
            </div>
        </div>

        <div id="tutorialsModal" class="modal">
            <div class="modal-content">
                <span class="modal-close">&times;</span>
                <h2>📖 Drawing Tutorials</h2>
                <div id="tutorialsContent"></div>
            </div>
        </div>
    </body>
</html>
